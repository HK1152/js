<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    
</head>
<body>
    <h1>BMI Calculator</h1>
   
        <div class="box">
            <h2>BMI Calculator</h2>
            <input type="range" id="weight" placeholder="Weight in kg" min="0" max="100" value="0" step="0.1" oninput="calculate()">
            <p id="weight-value">0 KG</p>
            <input type="range" id="height" placeholder="Height in cm" min="100" max="250" value="100" step="0.1"   oninput="calculate()">
            <p id="height-value">100 CM</p>
            <div id="result"></div>
        </div>
  
    <script src="script.js"></script>
</body>
</html>
