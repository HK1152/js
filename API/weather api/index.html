<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Weather App</title>
  <link rel="stylesheet" href="style.css"/>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>
  <!-- SVG Sprite (hidden): realistic sun, moon, clouds, drops, flakes, bolt -->
  <svg width="0" height="0" style="position:absolute;">
    <defs>
      <!-- Sun with rays -->
      <radialGradient id="sunGrad" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#FFE066"/>
        <stop offset="60%" stop-color="#FFC300"/>
        <stop offset="100%" stop-color="#FF9F1A"/>
      </radialGradient>
      <symbol id="sunSymbol" viewBox="0 0 200 200">
        <g>
          <circle cx="100" cy="100" r="40" fill="url(#sunGrad)"/>
          <!-- rays -->
          <g id="rays" stroke="#FFC300" stroke-width="6" stroke-linecap="round">
            <line x1="100" y1="8" x2="100" y2="35"/>
            <line x1="100" y1="165" x2="100" y2="192"/>
            <line x1="8" y1="100" x2="35" y2="100"/>
            <line x1="165" y1="100" x2="192" y2="100"/>
            <line x1="35" y1="35" x2="52" y2="52"/>
            <line x1="148" y1="148" x2="165" y2="165"/>
            <line x1="35" y1="165" x2="52" y2="148"/>
            <line x1="148" y1="52" x2="165" y2="35"/>
          </g>
        </g>
      </symbol>

      <!-- Crescent moon -->
      <linearGradient id="moonGrad" x1="0" x2="1" y1="0" y2="1">
        <stop offset="0%" stop-color="#F2F6FF"/>
        <stop offset="100%" stop-color="#D9E1FF"/>
      </linearGradient>
      <symbol id="moonSymbol" viewBox="0 0 200 200">
        <g>
          <circle cx="110" cy="100" r="60" fill="url(#moonGrad)"/>
          <circle cx="135" cy="90" r="60" fill="#1a1b2e"/>
        </g>
      </symbol>

      <!-- Fluffy cloud -->
      <filter id="cloudBlur" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="1.5"/>
      </filter>
      <symbol id="cloudSymbol" viewBox="0 0 300 120">
        <g filter="url(#cloudBlur)" fill="#FFFFFF">
          <ellipse cx="70"  cy="70"  rx="55" ry="35" />
          <ellipse cx="120" cy="55"  rx="60" ry="40" />
          <ellipse cx="170" cy="75"  rx="65" ry="45" />
          <ellipse cx="225" cy="65"  rx="55" ry="35" />
        </g>
      </symbol>

      <!-- Raindrop -->
      <symbol id="dropSymbol" viewBox="0 0 20 28">
        <path d="M10 0 C7 6 2 10 2 16 a8 8 0 0 0 16 0 C18 10 13 6 10 0z" fill="#5aa9ff"/>
      </symbol>

      <!-- Snowflake -->
      <symbol id="flakeSymbol" viewBox="0 0 24 24">
        <g stroke="#ffffff" stroke-width="2" stroke-linecap="round">
          <line x1="12" y1="1" x2="12" y2="23"/>
          <line x1="1" y1="12" x2="23" y2="12"/>
          <line x1="4" y1="4" x2="20" y2="20"/>
          <line x1="20" y1="4" x2="4" y2="20"/>
        </g>
      </symbol>

      <!-- Lightning bolt -->
      <symbol id="boltSymbol" viewBox="0 0 60 100">
        <polygon points="35,0 0,55 25,55 12,100 60,40 35,40" fill="#ffe94a" stroke="#ffd400" stroke-width="2"/>
      </symbol>
    </defs>
  </svg>

  <!-- Sky Layers -->
  <div class="sky">
    <div class="stars"></div>
    <div class="sun-wrap">
      <svg class="sun"><use href="#sunSymbol"/></svg>
    </div>
    <div class="moon-wrap">
      <svg class="moon"><use href="#moonSymbol"/></svg>
    </div>

    <!-- Clouds (multiple for parallax) -->
    <div class="clouds">
      <svg class="cloud c1"><use href="#cloudSymbol"/></svg>
      <svg class="cloud c2"><use href="#cloudSymbol"/></svg>
      <svg class="cloud c3"><use href="#cloudSymbol"/></svg>
    </div>

    <!-- Rain / Snow containers (populated by JS) -->
    <div class="rain-layer"></div>
    <div class="snow-layer"></div>

    <!-- Thunder flash + bolt -->
    <div class="flash"></div>
    <svg class="bolt"><use href="#boltSymbol"/></svg>
  </div>

  <!-- App UI -->
  <div class="container">
    <h1>Weather App</h1>
    <form>
      <input type="text" id="city" placeholder="Enter city name">
      <button type="submit">Get Weather</button>
    </form>
    <p id="error" class="error"></p>
    <div id="loading" style="display: none;">Loading...</div>
    <div id="weather" style="display: none;">
      <h2 id="city-name"></h2>
      <p id="temperature"></p>
      <p id="description"></p>
      <div class="details">
        <p>Humidity: <span id="humidity"></span></p>
        <p>Wind Speed: <span id="wind-speed"></span></p>
        <p>Pressure: <span id="pressure"></span></p>
        <p>Visibility: <span id="visibility"></span></p>
        <p>Cloudiness: <span id="cloudiness"></span></p>
        <p>Sunrise: <span id="sunrise"></span></p>
        <p>Sunset: <span id="sunset"></span></p>
        <p>Feels Like: <span id="feels-like"></span></p>
      </div>
    </div>
  </div>

  <div class="sky">
    <div class="sun-wrap">
      <svg class="sun" viewBox="0 0 100 100">
        <circle cx="50" cy="50" r="40" fill="#FFD700" />
      </svg>
    </div>
    <div class="moon-wrap">
      <svg class="moon" viewBox="0 0 100 100">
        <circle cx="50" cy="50" r="40" fill="#F0F8FF" />
        <circle cx="65" cy="35" r="40" fill="#282c34" />
      </svg>
    </div>
    <div class="stars"></div>
    <div class="clouds"></div>
    <div class="rain-layer"></div>
    <div class="snow-layer"></div>
    <div class="flash"></div>
    <div class="bolt"></div>
  </div>

  <script src="script.js"></script>

  <svg style="display: none;">
    <symbol id="dropSymbol" viewBox="0 0 10 10">
      <path d="M5 0 L0 10 L10 10 Z" fill="#ADD8E6" />
    </symbol>
    <symbol id="flakeSymbol" viewBox="0 0 10 10">
      <path d="M5 0 L6.5 3.5 L10 5 L6.5 6.5 L5 10 L3.5 6.5 L0 5 L3.5 3.5 Z" fill="#FFFFFF" />
    </symbol>
  </svg>
</body>
</html>
