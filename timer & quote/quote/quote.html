<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quotes</title>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="quote.css">
</head>
<body>
    <div class="panel quote-panel">
        <div class="quote-card">
            <blockquote id="quoteText">"Your time is limited, so don’t waste it living someone else’s life."</blockquote>
            <cite id="quoteAuthor">— Steve Jobs</cite>
            <button id="newQuoteBtn" class="btn btn-outline">New Quote</button>
        </div>
    </div>
    <script src="quote.js"></script>
</body>
</html>
