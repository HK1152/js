<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipe Book</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body >
    <div class="bg-light">
        <div class="container-fluid p-4">
            <div class="row">

                <!-- Left panel: Form -->
                <div class="col-md-4">
                    <div class="card shadow-sm mb-4">
                        <div class="card-body">
                            <h4 class="card-title mb-3">Add / Edit Recipe</h4>
                            <form id="recipeForm">
                                <div class="mb-3">
                                    <input type="text" id="recipeName" class="form-control" placeholder="Recipe Name"
                                        required>
                                </div>
                                <div class="mb-3">
                                    <textarea id="ingredients" class="form-control" placeholder="Ingredients" rows="3"
                                        required></textarea>
                                </div>
                                <div class="mb-3">
                                    <textarea id="instructions" class="form-control" placeholder="Instructions" rows="3"
                                        required></textarea>
                                </div>
                                <div class="mb-3">
                                    <select id="recipeCategory" class="form-select">
                                        <option value="all">Select Category</option>
                                        <option value="vegetarian">Vegetarian</option>
                                        <option value="vegan">Vegan</option>
                                        <option value="gluten-free">Gluten-Free</option>
                                    </select>
                                </div>
                                <button type="button" id="submit" class="btn btn-success w-100">Add Recipe</button>
                            </form>
                        </div>
                    </div>
                </div>

                <!-- Right panel: Recipes -->
                <div class="col-md-8">
                    <div class="d-flex gap-2 mb-3">
                        <input type="text" id="searchRecipes" class="form-control" placeholder="Search recipes...">
                        <select id="filter-selector" class="form-select" style="max-width: 200px;">
                            <option value="all">All</option>
                            <option value="vegetarian">Vegetarian</option>
                            <option value="vegan">Vegan</option>
                            <option value="gluten-free">Gluten-Free</option>
                        </select>
                    </div>
                    <div id="recipeList" class="row g-3"></div>
                </div>

            </div>
        </div>

        <!-- Bootstrap JS -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    </div>
    <!-- Custom JS -->
    <script src="script.js"></script>
</body>

</html>
