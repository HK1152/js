<!DOCTYPE html> 
 <html lang="en"> 
 <head> 
   <meta charset="UTF-8"> 
   <title>Form with JS Validation</title> 
<link rel="stylesheet" href="style.css">
 </head> 
 <body> 
 
 <form id="myForm" > 
   <h2>Registration Form</h2> 
 
   <label>Full Name:</label> 
   <input type="text" id="name" /> 
   <div class="error" id="nameError"></div> 
 
   <label>Email:</label> 
   <input type="email" id="email" /> 
   <div class="error" id="emailError"></div> 
 
   <label>Password:</label> 
   <input type="password" id="password" /> 
   <div class="error" id="passwordError"></div> 
 
   <label>Gender:</label> 
   <input type="radio" name="gender" value="male" /> Male 
   <input type="radio" name="gender" value="female" /> Female 
   <div class="error" id="genderError"></div> 
 
   <label>Hobbies:</label> 
   <input type="checkbox" name="hobby" value="reading" /> Reading 
   <input type="checkbox" name="hobby" value="traveling" /> Traveling 
   <input type="checkbox" name="hobby" value="music" /> Music 
   <div class="error" id="hobbyError"></div> 
 
   <label>Country:</label> 
   <select id="country"> 
     <option value="">Select Country</option> 
     <option value="india">India</option> 
     <option value="usa">USA</option> 
     <option value="uk">UK</option> 
   </select> 
   <div class="error" id="countryError"></div> 
 
   <label>Message:</label> 
   <textarea id="message" rows="3"></textarea> 
   <div class="error" id="messageError"></div> 
 
   <label>Profile Picture:</label> 
   <input type="file" id="file" /> 
   <div class="error" id="fileError"></div> 
 
   <label>Age (18-60):</label> 
   <input type="number" id="age" /> 
   <div class="error" id="ageError"></div> 
 
   <label>Birth Date:</label> 
   <input type="date" id="birthdate" /> 
   <div class="error" id="birthError"></div> 
 
   <label>Website:</label> 
   <input type="url" id="website" /> 
   <div class="error" id="websiteError"></div> 
 
   <label>Phone:</label> 
   <input type="tel" id="phone" /> 
   <div class="error" id="phoneError"></div> 
 
   <label>Experience Level:</label> 
   <input type="range" id="range" min="1" max="10" /> 
   <span id="rangeValue">5</span> 
   <br><br> 
 
   <button type="submit">Submit</button> 
 </form> 
 
 <script src="script.js"></script> 
 
 </body> 
 </html>
