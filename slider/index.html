<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
</head>
<body>
    <div class="container">
        <div class="img-slider">
            <img src="https://picsum.photos/id/237/700/400" alt="">
            <img src="https://picsum.photos/id/2/700/400" alt="">
            <img src="https://picsum.photos/id/27/700/400" alt="">
            <img src="https://picsum.photos/id/37/700/400" alt="">
            <img src="https://picsum.photos/id/23/700/400" alt="">
        </div>
        <button class="prev" onclick="change(-1)"><i class="fa-solid fa-angle-left"></i></button>
        <button class="next" onclick="change(1)"><i class="fa-solid fa-angle-right"></i>"></button>
    </div>
    <script>
        let sliders=0
        slider(sliders)

        function change(x){
            slider(sliders+=x)
        }

        function slider(n){
            const img=document.querySelectorAll("img")
            for(x of img){
                x.style.display="none"
            }
            if(n>=img.length){
                sliders=0
            }
            if(n<0){
                sliders=img.length-1
            }
            img[sliders].style.display="block"
        }
    </script>
</body>
</html>
